# Devise fixtures need encrypted_password to be valid.
# Generated with: Devise::Encryptor.digest(User, "password")
# The stretches config is 1 in test mode, so this hash matches "password".

one:
  name: Alice
  email: alice@example.com
  encrypted_password: <%= Devise::Encryptor.digest(User, "password") %>

two:
  name: Bob
  email: bob@example.com
  encrypted_password: <%= Devise::Encryptor.digest(User, "password") %>
